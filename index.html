<style>
:root{--iv:#F5F0E8;--fg:#35443B;--be:#B7A58A;--tx:#26282A;--mu:#6E6B66;--card:#FBF8F2;--bd:#E3DACB;--on:#F5F0E8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--iv:#1B211D;--fg:#B7A58A;--be:#8C7F69;--tx:#EDE7DB;--mu:#A39E94;--card:#242B26;--bd:#37403A;--on:#1B211D}}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--iv);color:var(--tx);font-family:Inter,system-ui,sans-serif;margin:0}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.rv{opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:1.5rem;transition:transform .35s ease,box-shadow .35s ease,border-color .35s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -22px rgba(53,68,59,.45);border-color:var(--be)}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.6rem;border-radius:999px;font-weight:500;font-size:.9rem;transition:all .3s;border:1px solid var(--fg);cursor:pointer}
.btn-p{background:var(--fg);color:var(--on)}.btn-p:hover{background:transparent;color:var(--fg)}
.btn-o{color:var(--fg)}.btn-o:hover{background:var(--fg);color:var(--on)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--be);outline-offset:3px}
.nl{position:relative;font-size:.85rem;color:var(--mu);transition:color .3s}
.nl:after{content:"";position:absolute;left:0;bottom:-6px;height:1px;width:0;background:var(--be);transition:width .3s}
.nl:hover,.nl.on{color:var(--fg)}.nl:hover:after,.nl.on:after{width:100%}
.inp{width:100%;background:transparent;border:1px solid var(--bd);border-radius:1rem;padding:.8rem 1rem;color:var(--tx)}
.inp:focus{border-color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}.rv{opacity:1;transform:none}}

const Reveal=({children,className=""})=>{

};

    </Reveal></div></Section>;

const Skills=()=><Section id="skills"><Heading k="Skills" t="What I bring to the table" s="Edit the SKILLS list at the top of the file to update this section."/>
  <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">{SKILLS.map(s=><Reveal key={s.cat}><div className="card p-7 h-full"><span className="inline-flex p-3 rounded-2xl" style={{background:"var(--fg)",color:"var(--on)"}}><Icon n={s.icon}/></span><h3 className="serif text-2xl mt-5" style={{color:"var(--fg)"}}>{s.cat}</h3><ul className="mt-3 grid gap-1.5">{s.items.map((i,k)=><li key={k} className="text-sm flex items-center gap-2" style={{color:"var(--mu)"}}><span className="w-1.5 h-1.5 rounded-full" style={{background:"var(--be)"}}></span>{i}</li>)}</ul></div></Reveal>)}</div></Section>;

const Services=()=><Section id="services" alt><Heading k="Services" t="How I can help"/>
  <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">{SERVICES.map((s,i)=><Reveal key={s.t}><div className="card p-8 h-full group"><div className="flex justify-between items-start"><Icon n={s.icon} s={28} c="text-[color:var(--fg)]"/><span className="serif italic text-3xl" style={{color:"var(--be)"}}>0{i+1}</span></div><h3 className="serif text-2xl mt-8" style={{color:"var(--fg)"}}>{s.t}</h3><p className="mt-2 text-sm" style={{color:"var(--mu)"}}>{s.d}</p><a href="#contact" className="inline-flex items-center gap-2 mt-6 text-sm transition-all group-hover:gap-3" style={{color:"var(--fg)"}}>Enquire <Icon n="arr" s={14}/></a></div></Reveal>)}</div></Section>;

function Thumb({p,big}){
  if(p.img) return <img src={p.img} alt={p.title} loading="lazy" width="600" height="400" className={`w-full object-cover ${big?"h-72":"h-52"}`}/>;
  const i=CATS.indexOf(p.cat);
  return <div role="img" aria-label={p.title+" placeholder thumbnail"} className={`w-full flex flex-col items-center justify-center ${big?"h-72":"h-52"}`} style={{background:i%2?"var(--be)":"var(--fg)",color:i%2?"var(--fg)":"var(--be)"}}><Icon n={["book","layers","spark","bot","file"][i]} s={big?44:34}/><span className="text-[10px] tracking-[.25em] uppercase mt-3 opacity-80">Image placeholder</span></div>;
}
function Modal({p,onClose}){
  useEffect(()=>{const k=e=>e.key==="Escape"&&onClose();document.addEventListener("keydown",k);document.body.style.overflow="hidden";return()=>{document.removeEventListener("keydown",k);document.body.style.overflow=""}},[]);
  return <div role="dialog" aria-modal="true" aria-label={p.title} className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{background:"rgba(20,26,22,.6)"}} onClick={onClose}>
    <div className="card max-w-2xl w-full max-h-[90vh] overflow-y-auto" style={{transform:"none"}} onClick={e=>e.stopPropagation()}>
      <Thumb p={p} big/>
      <div className="p-8"><div className="flex justify-between gap-4"><p className="text-xs tracking-[.25em] uppercase" style={{color:"var(--be)"}}>{p.cat}</p><button autoFocus aria-label="Close project" onClick={onClose} style={{color:"var(--fg)"}}><Icon n="x"/></button></div>
        <h3 className="serif text-3xl mt-2" style={{color:"var(--fg)"}}>{p.title}</h3><p className="mt-3" style={{color:"var(--mu)"}}>{p.detail}</p>
        <div className="flex flex-wrap gap-2 mt-5">{p.tools.map((t,i)=><span key={i} className="px-3 py-1 rounded-full text-xs" style={{border:"1px solid var(--bd)",color:"var(--fg)"}}>{t}</span>)}</div>
        {p.link&&<a href={p.link} target="_blank" rel="noopener" className="btn btn-p mt-6">Visit project <Icon n="arr" s={16}/></a>}</div></div></div>;
}
function Portfolio(){
  const [f,setF]=useState("All"),[sel,setSel]=useState(null);
  const list=PROJECTS.filter(p=>f==="All"||p.cat===f);
  return <Section id="portfolio"><Heading k="Portfolio" t="Selected projects" s="Placeholder projects only. Replace them with your real work in the PROJECTS list."/>
    <div className="flex flex-wrap gap-2 mb-10" role="group" aria-label="Filter projects">{["All",...CATS].map(c=><button key={c} onClick={()=>setF(c)} aria-pressed={f===c} className="px-4 py-2 rounded-full text-sm transition-all" style={f===c?{background:"var(--fg)",color:"var(--on)",border:"1px solid var(--fg)"}:{border:"1px solid var(--bd)",color:"var(--mu)"}}>{c}</button>)}</div>
    <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">{list.map(p=><article key={p.id} className="card overflow-hidden flex flex-col"><Thumb p={p}/><div className="p-6 flex flex-col flex-1"><p className="text-[11px] tracking-[.2em] uppercase" style={{color:"var(--be)"}}>{p.cat}</p><h3 className="serif text-2xl mt-1" style={{color:"var(--fg)"}}>{p.title}</h3><p className="text-sm mt-2 flex-1" style={{color:"var(--mu)"}}>{p.desc}</p><button onClick={()=>setSel(p)} className="btn btn-o mt-5 self-start !py-2">View Project <Icon n="arr" s={14}/></button></div></article>)}</div>
    {sel&&<Modal p={sel} onClose={()=>setSel(null)}/>}</Section>;
}

const Experience=()=><Section id="experience" alt><Heading k="Experience" t="Professional journey"/>
  <ol className="relative ml-3 pl-8 grid gap-8" style={{borderLeft:"1px solid var(--be)"}}>{EXPERIENCE.map((e,i)=><li key={i} className="relative"><span className="absolute -left-[41px] top-7 w-4 h-4 rounded-full" style={{background:"var(--fg)",border:"3px solid var(--iv)"}}></span>
    <Reveal><div className="card p-7"><div className="flex flex-wrap justify-between gap-2"><div><h3 className="serif text-2xl" style={{color:"var(--fg)"}}>{e.role}</h3><p style={{color:"var(--mu)"}}>{e.org}</p></div><span className="text-sm px-3 py-1 rounded-full h-fit" style={{border:"1px solid var(--be)",color:"var(--fg)"}}>{e.period}</span></div>
    <div className="grid md:grid-cols-2 gap-6 mt-5 text-sm"><div><h4 className="text-xs tracking-[.2em] uppercase mb-2" style={{color:"var(--be)"}}>Responsibilities</h4><ul className="grid gap-1" style={{color:"var(--mu)"}}>{e.resp.map((r,k)=><li key={k}>— {r}</li>)}</ul></div><div><h4 className="text-xs tracking-[.2em] uppercase mb-2" style={{color:"var(--be)"}}>Key achievements</h4><ul className="grid gap-1" style={{color:"var(--mu)"}}>{e.ach.map((r,k)=><li key={k}>— {r}</li>)}</ul></div></div></div></Reveal></li>)}</ol></Section>;

const Education=()=><Section id="education"><Heading k="Education" t="Academic background"/>
  <div className="grid md:grid-cols-2 gap-6">{EDUCATION.map((e,i)=><Reveal key={i}><div className="card p-8"><Icon n="book" s={28} c="text-[color:var(--fg)]"/><h3 className="serif text-2xl mt-5" style={{color:"var(--fg)"}}>{e.inst}</h3><p className="mt-1" style={{color:"var(--tx)"}}>{e.degree} · {e.dept}</p><p className="text-sm mt-1" style={{color:"var(--be)"}}>{e.period}</p><p className="text-sm mt-3" style={{color:"var(--mu)"}}>{e.detail}</p></div></Reveal>)}</div></Section>;

function Contact(){
  const [d,setD]=useState({name:"",email:"",subject:"",message:""});
  const set=k=>e=>setD({...d,[k]:e.target.value});
  const submit=e=>{e.preventDefault();window.location.href=`mailto:${SITE.email}?subject=${encodeURIComponent(d.subject)}&body=${encodeURIComponent(d.message+"\n\n— "+d.name+" ("+d.email+")")}`};
  const info=[["mail",SITE.email,"mailto:"+SITE.email],["phone",SITE.phone,"tel:"+SITE.phone.replace(/\s/g,"")],["pin",SITE.location]];
  const soc=[["in","LinkedIn",SITE.social.linkedin],["fb","Facebook",SITE.social.facebook],["ig","Instagram",SITE.social.instagram],["wa","WhatsApp",SITE.social.whatsapp]];
  return <Section id="contact" alt><Heading k="Contact" t="Let’s work together"/>
    <div className="grid md:grid-cols-2 gap-8">
      <Reveal className="grid gap-4 content-start">{info.map(([i,t,h])=><div key={i} className="card p-5 flex items-center gap-4"><span className="p-3 rounded-2xl" style={{background:"var(--fg)",color:"var(--on)"}}><Icon n={i} s={18}/></span>{h?<a href={h} style={{color:"var(--tx)"}}>{t}</a>:<span>{t}</span>}</div>)}
        <div className="flex flex-wrap gap-3 mt-2">{soc.map(([i,l,h])=><a key={l} href={h} target="_blank" rel="noopener" aria-label={l} title={l} className="p-3 rounded-full transition-all hover:-translate-y-1" style={{border:"1px solid var(--be)",color:"var(--fg)"}}><Icon n={i}/></a>)}</div></Reveal>
      <Reveal><form onSubmit={submit} className="card p-7 grid gap-4" style={{transform:"none"}}>
        {[["name","Name","text"],["email","Email","email"],["subject","Subject","text"]].map(([k,l,t])=><label key={k} className="grid gap-1 text-sm" style={{color:"var(--mu)"}}>{l}<input required type={t} value={d[k]} onChange={set(k)} className="inp"/></label>)}
        <label className="grid gap-1 text-sm" style={{color:"var(--mu)"}}>Message<textarea required rows="5" value={d.message} onChange={set("message")} className="inp"></textarea></label>
        <button className="btn btn-p justify-center" type="submit"><Icon n="mail" s={16}/> Open in email app</button>
        <p className="text-xs" style={{color:"var(--mu)"}}>This form has no server: it opens your email app with the message pre-filled. Nothing is sent automatically.</p></form></Reveal></div></Section>;
}

function Resume(){
  const [show,setShow]=useState(false);
  const dl=()=>{const t=`${SITE.name} — CV (PLACEHOLDER)\n${SITE.role}\n\nReplace this file by setting SITE.cvUrl to your real CV.`;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download="Sadikur-Atelier-CV-placeholder.txt";a.click()};
  return <Section id="resume"><Heading k="Resume / CV" t="My résumé" s="A placeholder CV is used until you add your own."/>
    <Reveal><div className="flex flex-wrap gap-4">
      {SITE.cvUrl?<a className="btn btn-p" href={SITE.cvUrl} download><Icon n="dl" s={16}/> Download CV</a>:<button className="btn btn-p" onClick={dl}><Icon n="dl" s={16}/> Download CV</button>}
      {SITE.cvUrl?<a className="btn btn-o" href={SITE.cvUrl} target="_blank" rel="noopener"><Icon n="eye" s={16}/> View CV</a>:<button className="btn btn-o" aria-expanded={show} onClick={()=>setShow(!show)}><Icon n="eye" s={16}/> {show?"Hide":"View"} CV</button>}</div>
    {show&&!SITE.cvUrl&&<div className="card p-10 mt-8 max-w-2xl" style={{transform:"none"}}><h3 className="serif text-4xl" style={{color:"var(--fg)"}}>{SITE.name}</h3><p style={{color:"var(--be)"}}>{SITE.role}</p><hr className="my-5" style={{borderColor:"var(--bd)"}}/>
      {[["Profile",ABOUT.bio],["Experience",EXPERIENCE.map(e=>`${e.role}, ${e.org} (${e.period})`).join(" · ")],["Education",EDUCATION.map(e=>`${e.degree}, ${e.inst}`).join(" · ")],["Skills",SKILLS.map(s=>s.cat).join(" · ")]].map(([h,t])=><div key={h} className="mb-4"><h4 className="text-xs tracking-[.2em] uppercase" style={{color:"var(--be)"}}>{h}</h4><p className="text-sm mt-1" style={{color:"var(--mu)"}}>{t}</p></div>)}</div>}</Reveal></Section>;
}

const Footer=()=><footer className="py-12" style={{background:"var(--fg)",color:"var(--on)"}}><div className="max-w-6xl mx-auto px-6 flex flex-wrap gap-6 justify-between items-center">
  <div><p className="serif italic text-2xl">Sadikur Atelier</p><p className="text-sm opacity-70 mt-1">{SITE.tagline}</p></div>
  <div className="flex gap-3">{[["in","LinkedIn",SITE.social.linkedin],["fb","Facebook",SITE.social.facebook],["ig","Instagram",SITE.social.instagram],["wa","WhatsApp",SITE.social.whatsapp]].map(([i,l,h])=><a key={l} href={h} target="_blank" rel="noopener" aria-label={l} className="p-2.5 rounded-full opacity-80 hover:opacity-100" style={{border:"1px solid currentColor"}}><Icon n={i} s={16}/></a>)}</div>
  <p className="text-xs opacity-60 w-full">© {new Date().getFullYear()} Sadikur Atelier. All rights reserved.</p></div></footer>;

const NotFound=()=><main className="min-h-screen flex items-center justify-center text-center px-6"><div><p className="serif italic text-9xl" style={{color:"var(--be)"}}>404</p><h1 className="serif text-4xl mt-2" style={{color:"var(--fg)"}}>This page doesn’t exist</h1><p className="mt-3" style={{color:"var(--mu)"}}>The section you’re looking for couldn’t be found.</p><a href="#home" className="btn btn-p mt-8">Back to Home</a></div></main>;

function App(){
  const [active,setActive]=useState("home"),[top,setTop]=useState(false),[load,setLoad]=useState(true),[hash,setHash]=useState(location.hash.slice(1));
  useEffect(()=>{setTimeout(()=>setLoad(false),500);const h=()=>setHash(location.hash.slice(1));addEventListener("hashchange",h);return()=>removeEventListener("hashchange",h)},[]);
  useEffect(()=>{
    const s=()=>{setTop(scrollY>600);let c="home";IDS.forEach(i=>{const e=document.getElementById(i);if(e&&e.getBoundingClientRect().top<140)c=i});setActive(c)};
    s();addEventListener("scroll",s,{passive:true});return()=>removeEventListener("scroll",s)},[hash]);
  if(hash&&!IDS.includes(hash)) return <NotFound/>;
  return <>
    {load&&<div className="fixed inset-0 z-[60] flex items-center justify-center" style={{background:"var(--fg)",color:"var(--be)"}}><span className="serif italic text-4xl animate-pulse">Sadikur Atelier</span></div>}
    <a href="#home" className="sr-only focus:not-sr-only">Skip to content</a>
    <Nav active={active}/>
    <main><Home/><About/><Skills/><Services/><Portfolio/><Experience/><Education/><Contact/><Resume/></main>
    <Footer/>
    <button aria-label="Back to top" onClick={()=>scrollTo({top:0,behavior:"smooth"})} className="fixed right-5 bottom-5 p-3 rounded-full transition-all z-40" style={{background:"var(--fg)",color:"var(--on)",opacity:top?1:0,pointerEvents:top?"auto":"none",transform:top?"none":"translateY(12px)",marginBottom:"env(safe-area-inset-bottom,0px)"}}><Icon n="up"/></button>
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
